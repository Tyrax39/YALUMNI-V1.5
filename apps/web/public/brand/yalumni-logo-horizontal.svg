  <path d="M178 176 L104 106" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
  <path d="M178 176 L259 95" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
  <path d="M178 176 L178 272" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
  <path d="M178 176 L236 230" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity="0.82"/>
  <path d="M178 176 L121 232" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity="0.82"/>

  <!-- nodes -->
