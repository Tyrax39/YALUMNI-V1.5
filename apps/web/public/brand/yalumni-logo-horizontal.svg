<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="YALUMNI horizontal logo">
<title>YALUMNI Horizontal Logo Concept</title>
<rect width="1000" height="220" fill="transparent"/>
<g transform="translate(24,24) scale(0.42)">
  <title>YALUMNI Logo Icon</title>
  <desc>Original circular network mark for a YALI alumni platform concept, using a connected Y shape, alumni nodes, and impact star.</desc>
  <rect width="360" height="360" fill="none" opacity="0"/>
  <circle cx="180" cy="180" r="158" fill="#24AEE4"/>
  <circle cx="180" cy="180" r="158" fill="none" stroke="#16286A" stroke-width="13"/>
  <circle cx="180" cy="180" r="139" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.92"/>

  <!-- abstract continent/network field -->
  <path d="M95 115 C112 85 158 71 197 81 C228 89 250 111 263 144 C276 177 269 218 245 246 C220 275 182 288 146 278 C110 267 82 239 74 203 C68 173 77 139 95 115 Z" fill="#FFFFFF" opacity="0.11"/>
  <path d="M111 125 C124 104 148 95 171 101 C187 105 197 120 192 136 C187 153 170 161 167 181 C164 203 187 211 183 232 C180 250 158 259 138 251 C108 239 91 207 94 177 C96 156 101 141 111 125 Z" fill="#FFFFFF" opacity="0.18"/>

