  <circle cx="259" cy="95" r="17" fill="#16286A" stroke="#FFFFFF" stroke-width="7"/>
  <circle cx="178" cy="272" r="17" fill="#16286A" stroke="#FFFFFF" stroke-width="7"/>
  <circle cx="121" cy="232" r="10" fill="#16286A" stroke="#FFFFFF" stroke-width="5" opacity="0.95"/>
  <circle cx="236" cy="230" r="10" fill="#16286A" stroke="#FFFFFF" stroke-width="5" opacity="0.95"/>

  <!-- impact star / compass -->
  <polygon points="178.00,132.00 189.17,160.63 219.85,162.40 196.07,181.87 203.86,211.60 178.00,195.00 152.14,211.60 159.93,181.87 136.15,162.40 166.83,160.63" fill="#E9324F" stroke="#FFFFFF" stroke-width="6"/>
  <polygon points="203.08,157.78 190.00,176.00 203.08,194.22 181.71,187.41 168.42,205.48 168.29,183.05 147.00,176.00 168.29,168.95 168.42,146.52 181.71,164.59" fill="#61718F" opacity="0.92"/>
