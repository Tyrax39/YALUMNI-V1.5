<g transform="translate(190,58)">
  <text x="0" y="65" font-family="Montserrat, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="3" fill="#16286A">YAL</text>
  <text x="167" y="65" font-family="Montserrat, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="3" fill="#24AEE4">UMNI</text>
  <text x="0" y="111" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5" fill="#16286A">YALI ALUMNI NETWORK</text>
